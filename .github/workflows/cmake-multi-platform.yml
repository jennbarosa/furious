name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - c_compiler: gcc
            cpp_compiler: g++

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ccache \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libgl-dev libgtk-3-dev \
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
          librubberband-dev \
          libasound2-dev \
          xvfb

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-linux-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-linux-${{ github.ref }}-
          ccache-linux-refs/heads/main-

    - name: Cache FetchContent dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: fetchcontent-linux-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          fetchcontent-linux-

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
        -S ${{ github.workspace }}

    - name: Build
      run: xvfb-run cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: xvfb-run ctest --build-config ${{ matrix.build_type }} --output-on-failure

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg
        key: vcpkg-win
        restore-keys: vcpkg-win

    - name: Set up vcpkg
      run: |
        if (-Not (Test-Path "${{ github.workspace }}/vcpkg/vcpkg.exe")) {
          git clone --recurse-submodules https://github.com/microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
        }
        .\vcpkg\vcpkg.exe install --triplet x64-windows

    - name: Cache FetchContent dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: fetchcontent-windows-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          fetchcontent-windows-

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -DBUILD_INTEGRATION_TESTS=OFF
        -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      working-directory: build
      run: ctest --build-config Release --output-on-failure
